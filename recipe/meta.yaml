{% set name = "pbr" %}
{% set version = "7.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9a4a85b84e906337708009af0b5f5cdabeeb72d4dc213c9e97974da54fd9acc5

build:
  number: 0
  preserve_egg_dir: true
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pbr = pbr.cmd.main:main

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools >=64.0.0
  run:
    - python
    # Upstream source - https://opendev.org/openstack/pbr/src/tag/7.1.3/requirements.txt  
    - setuptools

# All tests require fixture package which is not available on main channel.
test:
  imports:
    - pbr
    - pbr.hooks
    - pbr.pbr_json
    - pbr.version
  requires:
    - pip
  commands:
    - pip check
    - pbr --help

about:
  home: https://launchpad.net/pbr
  license_file: LICENSE
  license: Apache-2.0
  license_family: Apache
  summary: PBR is a library that injects some useful and sensible default behaviors into your setuptools run.
  description: |
    PBR is a library that injects some useful and sensible default behaviors into your setuptools run.
    It started off life as the chunks of code that were copied between all of the OpenStack projects.
    Around the time that OpenStack hit 18 different projects each with at least 3 active branches,
    it seemed like a good time to make that code into a proper reusable library.
  doc_url: https://docs.openstack.org/developer/pbr
  dev_url: https://opendev.org/openstack/pbr

extra:
  recipe-maintainers:
    - jakirkham
    - pmlandwehr
    - tschoonj
  skip-lints:
    - python_build_tools_in_host